# 64 位 DXVK 渲染器配置（bin\.l4d2bridge\dxvk.conf）

# 异步编译着色器（不阻塞渲染线程）
dxvk.enableAsync = True

# 图形管线库异步缓存
dxvk.gplAsyncCache = True

# 管线缓存持久化到磁盘（二次启动秒进）
dxvk.enableStateCache = True

# 描述符更新模板（省 CPU）
dxvk.enableDescriptorUpdateTemplates = True

# 图形管线库（2026-10-04 21:3x：GPL×Async 冲突已修，开回 Auto）
# 之前的频闪 = fork 的 Async 路径在 GPL 开启时把新管线永久丢弃（主线程跳帧 + 后台 worker 提前
# return）。已在 dxvk_graphics.cpp 修复：可 fast-link 的状态改走同步快链（首帧不跳帧），
# Async 只做"需整体编译"状态的兜底。现在 Auto + Async 可共存。
dxvk.enableGraphicsPipelineLibrary = Auto

# sampler 类型改走"特化常量"：同一条管线可快速特化出 2D/cube/3D 等不同 sampler 类型，
# 不必为每种组合各编一份 ⇒ 管线数量与着色器编译量大幅下降（首进图更快）。
# 代价：某 shader 的 sampler 类型中途变化时要重新特化一次（很便宜）。
# 旁证：DXVK 自己就对 Halo CE/HaloPC 强制打开这一项（config.cpp 的 per-app 表）。
# d3d9.forceSamplerTypeSpecConstants = True   ; 2026-10-04 19:20 回退：疑似画面斜纹/频闪（DXVK 文档写明可能破坏渲染，先关）

# 着色器编译线程数（0 = 自动）
dxvk.numCompilerThreads = 0

# 帧节奏策略
dxvk.framePace = "max-frame-latency"

# 呈现帧率上限（帧生成下约等于游戏帧率×2）
d3d9.maxFrameRate = 240

# CPU 领先 GPU 的最大帧数（2026-10-04 21:0x 按用户要求：取游戏根目录 dxvk.conf 的值 = 2）
d3d9.maxFrameLatency = 2

# 后台缓冲数量（2026-10-04 21:0x 按用户要求：取游戏根目录 dxvk.conf 的值 = 3）
d3d9.numBackBuffers = 3

# 追踪管线生命周期，释放 32 位虚拟地址空间
dxvk.trackPipelineLifetime = True

# 显存自动整理
dxvk.enableMemoryDefrag = Auto

# Vulkan 堆预算（0 = 自动）
dxvk.maxMemoryBudget = 0

# 上报给引擎的可用显存（MB）。2026-10-04 21:0x 按用户要求回到 8192（= 游戏根目录 dxvk.conf
# 的值，也就是"不闪时代"实际生效的那个数）；6144 是给多 MOD/16 人服务器的保守值。
# 注：桥的"显存闸门"（vkup.cfg 的 opt_vram_*）在压力高时还会在此基础上再打折上报。
d3d9.maxAvailableMemory = 8192

# 游戏侧纹理映射上限（MB；过低会把 HUD/字体等冷纹理逐出，造成花屏闪烁）
# 2026-10-04 20:3x：126 -> 512（诊断值，用户要求试）。依据：console.log 里
#   "Material engine/preloadtexture has bad reference count 0 when being bound"
#   每局 17k~24k 次（逐帧），= 纹理数据被逐出后材质仍在使用 ⇒ 表现就是 HUD 逐帧频闪；
#   而本键正是"告诉引擎它有多少纹理内存"的唯一旋钮（反馈 #5 的 HUD 花屏就是 64 -> 100 修的）。
# 诊断判据：HUD 是否不闪 + 上面那条计数是否大幅下降。显存实测只用 49%，有余量。
# 若确认有效：从 256 起逐步回落，找"不闪的最低值"；无效：写回 126。
d3d9.textureMemory = 512

# 浮点模拟（自动，快且准）
d3d9.floatEmulation = Auto

# 设备本地常量缓冲（AMD 上更慢）
d3d9.deviceLocalConstantBuffers = False

# 窗口化下也应用引擎亮度（桥强制窗口化，否则画面偏暗）
# d3d9.windowedGammaRamp = True                 ; 2026-10-04 19:20 回退：疑似过曝/频闪（此前的有效配置里没有这一项）

# MANAGED 纹理 CPU 拷贝（试验后保持默认关）
# d3d9.dropManagedCpuCopy = False

# NVIDIA 低延迟2（自动）
dxvk.disableNvLowLatency2 = Auto

# 可选：游戏内 HUD（去掉注释显示 fps/显存/负载）
# dxvk.hud = fps,memory,gpuload,devinfo

# Present 放大算法（2 = 双三次 + RCAS 锐化，画质最好）
fsr = 2

# Reset 时容忍仍存活的 D3DPOOL_DEFAULT 资源（否则切 vsync 冻结）
d3d9.countLosableResources = False
