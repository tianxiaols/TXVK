# ============================================================
# DXVK-GPLALL 2.6.8 optimized config for L4D2 (32-bit Source engine)
# Final performance-optimized config. Every option chosen to maximize
# CPU / VRAM / memory / cache / GC behavior for a 32-bit CPU-bound game.
# ============================================================

# ---- Shader compilation (main stutter source) -----------------
# Async: never block the render thread on shader compile.
dxvk.enableAsync = True
dxvk.gplAsyncCache = True
# Persist pipeline cache to disk (2nd+ runs are instant).
dxvk.enableStateCache = True
# 32-bit: avoids costly vkUpdateDescriptorSets struct conversion (big CPU win).
dxvk.enableDescriptorUpdateTemplates = True
# GPL is superseded by Async in GPLALL; keeping it off is faster & safer.
dxvk.enableGraphicsPipelineLibrary = False
# Auto compiler threads (32-bit capped at 12 automatically).
dxvk.numCompilerThreads = 0

# ---- Frame pacing ----------------------------------------------
dxvk.framePace = "max-frame-latency"
# [vkup] Present rate cap. DXVK's limiter counts PRESENTS, and with frame
# generation there are two per game frame (generated + real), so this number is
# roughly 2x the game's frame rate.
#  240 = effectively "no limit": the game itself tops out near 160 fps here, so
#        the cap never binds and the limiter stays out of the way.
#  120 = 60 game fps, 120 presents/s = exactly every other refresh of the 240 Hz
#        panel, i.e. every present is displayed for the same two refreshes.
#   80 = 40 game fps, 80 presents/s, three refreshes each.
# 0   = no limit (same as 240 in practice).
d3d9.maxFrameRate = 240
# Allow CPU to run up to 2 frames ahead of GPU: reduces per-frame fence wait
# in Present, overlapping CPU and GPU work. Big win for a CPU-bound 32-bit game.
d3d9.maxFrameLatency = 1
# Give the swapchain enough back buffers so CPU can actually run ahead without
# stalling on vkAcquireNextImageKHR (needs >= maxFrameLatency+1). Reduces the
# per-frame Present acquire wait / VK_NOT_READY spinning in 32-bit.
d3d9.numBackBuffers = 2

# ---- 32-bit address space --------------------------------------
# Release pipeline libraries to free 32-bit virtual address space.
dxvk.trackPipelineLifetime = True

# ---- VRAM / memory ---------------------------------------------
# Auto memory defrag (protects against VRAM fragmentation under pressure).
dxvk.enableMemoryDefrag = Auto
# Keep the Vulkan heap budget auto; do not force a reservation.
dxvk.maxMemoryBudget = 0

# ---- D3D9-specific ----------------------------------------------
# Report more available VRAM so the engine doesn't throttle texture streaming.
d3d9.maxAvailableMemory = 8192
# Game-side texture mapping cap (MB): DXVK unmaps LRU cold textures once mapped
# memory exceeds this, releasing game-side commit; cold pages are kept resident
# by helper64 so remap is fast. 64 keeps game memory lower than the default 100.
d3d9.textureMemory = 64
# Float emulation: auto (fast-but-accurate, safe).
# [vkup 2026-10-02] ?????? C???????????????????????? floatEmulation ?????? False?????? Source ?????????
# ??? D3DCOLORtoUBYTE4 ????????? tonemap ??????????????? 64 ??? DXVK ?????????
# ?????????mat_info ??? m_HDRType / ?????? caps ?????????????????????????????? ??? ?????? ???????????? Auto???
d3d9.floatEmulation = Auto
# deviceLocalConstantBuffers is slower on AMD / same on NVIDIA -> keep off.
d3d9.deviceLocalConstantBuffers = False

# ---- 32->64 bit bridge (only used while the bridge is active) ----
# [vkup] Upstream DXVK only honours the D3D9 gamma ramp in FULLSCREEN
# presentation (d3d9_swapchain.cpp: "!isIdentity && !m_presentParams.Windowed").
# The bridge forces windowed presentation on the server side
# (client.forceWindowed = True), so the brightness the engine installs via
# SetGammaRamp would be dropped. True keeps it applied in windowed mode.
# Ignored by the 32-bit DXVK (it runs fullscreen, where the ramp already works).
# [vkup 2026-10-02] TEST: set to False to match the 32-bit DXVK that renders the
# old (non bridge) world correctly. That build does NOT contain this patch at
# all (string count 0), so in the old world the engine's brightness ramp was
# never applied. The bridge forces windowed presentation, so with True the
# server DOES apply the ramp - the only code level difference left between the
# two worlds. A darker image makes the map's green fog/ambient dominate, which
# is exactly the reported "everything is dark green" look.
d3d9.windowedGammaRamp = True

# ---- MANAGED texture CPU copies (build-difference test, 2026-10-02) --------
# The 32-bit DXVK that renders CORRECTLY in the old (non-bridge) world was built
# 2026-09-28 19:05 and does not contain this patch; the 64-bit server build
# (2026-09-30 19:09) does. The patch drops the CPU copy of D3DPOOL_MANAGED
# textures and re-reads them from the GPU on the first LockRect - but Source
# RENDERS INTO its lightmaps (dynamic lighting / sky light updates) and reads
# them back, so a stale GPU copy would destroy the level's lighting: flat and
# tinted world geometry while props and the HUD stay correct.
# Set to False so the server behaves exactly like the old 32-bit build.
# [vkup 2026-10-02] TESTED: setting this to False changed nothing (the tint was
# still there), and the string exists in BOTH builds, so it is NOT a difference
# between the working 32-bit DXVK and the server build. Left at its default.
# d3d9.dropManagedCpuCopy = False

# ---- Misc --------------------------------------------------------
# Let DXVK auto-manage Nvidia low-latency2.
dxvk.disableNvLowLatency2 = Auto

# Optional: monitor with HUD (uncomment to see fps/memory/gpuload)
# dxvk.hud = fps,memory,gpuload,devinfo
fsr = 2


# [vkup 2026-10-03] Tolerate alive D3DPOOL_DEFAULT resources on Reset, like Windows D3D9.
# The fork's strict check made toggling vsync (which calls Reset) freeze the game.
d3d9.countLosableResources = False
