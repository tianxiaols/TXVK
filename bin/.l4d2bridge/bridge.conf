# Bridge config: run a VANILLA 64-bit DXVK as the server renderer.
# No RTX Remix path tracing is involved (see REMIX_20260930 note in the workspace).
server.useVanillaDxvk = True

# Remix API stays off - we do not want the ray tracing stack.
exposeRemixApi = False

# Only attach inside the game process.
client.targetProcess = left4dead2.exe

# First-run troubleshooting switch (harmless; can be disabled later).
client.setExceptionHandler = True

# Server-side presentation is forced windowed. An exclusive-fullscreen display
# mode switch is executed BY THE SERVER PROCESS, and it blocks because the game
# window belongs to a thread that is itself blocked inside CreateDevice
# (observed 2026-09-30: ~29 s stall -> Windows AppHangB1 killed the game).
client.forceWindowed = True

# ENB reads the backbuffer for its effects. Off by default; set True if the
# ENB image looks wrong under the bridge (costs extra IPC traffic).
# client.enableBackbufferCapture = True

# vkup 2026-10-02: all diagnostic printing is OFF again (it made the game
# stutter: per-call logging on the critical path). The [cp]/[srv] probes in the
# source are disabled too, and this build is a Release build, so nothing here
# matters any more - the keys stay so the intent is documented.
client.logColorPath = False
logApiCalls = False
logServerCommands = False

# --- 32-bit address space (2026-09-30) --------------------------------------
# The game died with tier0's "***** OUT OF MEMORY! attempted allocation size:
# 5592640 ****" after ~73 s of play. Reason: the client keeps a FULL-SIZE
# private shadow copy in the 32-bit process for every surface that is ever
# locked (d3d9_surface.cpp: m_shadow = new uint8_t[surfaceSize]) and for every
# vertex/index buffer (lockable_buffer.h: make_unique<uint8_t[]>(Size)), freed
# only when that D3D9 object is destroyed. Streaming textures lock surfaces all
# the time, so the game grew into the 4 GB address space (3 GB of free RAM is
# irrelevant - the engine needs CONTIGUOUS VA, and these are private commits).
#
# EXPERIMENT 2026-09-30 19:11: useSharedHeap = True was tried to move those
# shadows into pagefile-backed segments - IT HANGS THE GAME. The heap grew to
# ~2.2 GB of mapped VA, then failed to create further segments and every failed
# allocation BLOCKS for a 10 s timeout (sharedHeapFreeChunkWaitTimeout):
#   [SharedHeap][findAllocation] Unable to allocate 512kB ... Timeout!
#   [SharedHeap][addNewHeapSegment] Failed to create new SharedHeap segment.
#   [Direct3DSurface9_LSS][LockRect] Failed!
# -> loading screen freezes hard. Keep this OFF for L4D2.
useSharedHeap = False
# sharedHeapPolicy = Textures, StaticBuffers     (inert while useSharedHeap = False)
# sharedHeapDefaultSegmentSize = 64MB
# sharedHeapChunkSize = 4kB
sharedHeapFreeChunkWaitTimeout = 2

# The client's channels are pagefile-backed sections mapped into the 32-bit
# process: 96MB + 4MB by default. Reduced here to buy VA back (keep it above
# the largest single upload the engine does).
clientChannelMemSize = 48MB

# Diagnostic: quantifies the per-object shadow copies the client keeps
# ("Allocated a shadow for surface ... total surface shadow size: N" and the
# buffer equivalent) in bridge32.log.
logLevel = Info
eliminateRedundantSetterCalls = True
vkupShaderCache = True
vkupBufferPool = True
vkupClientDebug = True

# --- [vkup 2026-10-03] VScript visibility ----------------------------------
# The game crashes inside vscript.dll (two runs, same offset 0x3F06D) and the
# minidump cannot name the .nut involved. vkup_vscript walks the VM's pointer
# graph from vscript.dll+0x53164 and logs every script name it can reach:
#   [vkup] vs: script seen: <path>      first time a script is reachable
#   [vkup] vs: + <path> (depth N)       it just entered / is being executed
#   [vkup] vs: - <path>                 its frame left the VM
# At crash time the same trail is written to <dump>.vscript.txt, including the
# live set sorted by hop depth. Trace adds the pointer hop chains (the data
# needed to make the probe report "file :: function :: line" precisely).
vkupVScriptLog = False
vkupVScriptTrace = False
# Crash trail: always writes <dump>.vscript.txt with the faulting module+offset,
# the accessed address, the faulting thread's EBP chain and the .nut names that
# are still reachable from its stack. Independent of the walk above (it only
# runs once the game is already dying, so it is safe to leave armed).
vkupVScriptCrashTrail = True
# vscript.dll's "SCRIPT PERF WARNING" path reads a Squirrel type tag as a pointer
# and takes the game down whenever a single script call exceeds 1.5 s
# (vscript.dll+0x3F06D, verified from the 2026-10-03 crash dumps). The lookup
# only feeds the "%s" of the warning, so it is redirected to the engine's own
# placeholder. Set to False to get the exact crash back for analysis.
vkupVScriptPerfPatch = True
# Stall instrumentation (2026-10-03): the 20-30 s level-transition freeze is
# intermittent, so collect evidence from the "light" version of the hitch too.
#  - CMDGAP          : one line per >=1 s gap in D3D9 commands (cost distribution)
#  - STALL-SAMPLE    : while a hitch lasts, 4x/s sample the busy thread
#                      (registers + scan cursor + PageFaultCount + EBP chain)
# Revert to 3000 when the investigation is over (3 s is the "real" stall).
vkupGapLog = False
vkupGapLogMs = 900
# [vkup 2026-10-03] CPU: the two expensive gates are off, the cheap one stays.
#   vkupShadowGuard      - scanned 64 guard bytes on *every* unlock (+ a 64 byte
#                          memset per shadow allocation): measurable, off.
#   vkupShadowQuarantine - memset every evicted shadow with 0xDD and re-scanned
#                          the whole quarantine (up to 8 MB) once a second: off.
#                          (verifyQuarantine is now gated as well, see vkup_diag.cpp.)
#   vkupLockAudit        - KEEP ON: it counts locks, but it is also what contains
#                          an out of range lock in a scratch buffer instead of
#                          letting the game write past our allocation. A few
#                          comparisons per lock is not worth losing that.
vkupLockAudit = True
vkupShadowGuard = False
vkupShadowQuarantine = False
vkupShadowQuarantineMB = 8
# [vkup 2026-10-03 16:2x] OFF while we chase the "exit from the main menu hangs"
# report: the sampler wakes up exactly when the game stops issuing D3D9 commands,
# which is also what the shutdown sequence looks like, and it then suspends/resumes
# every thread 4x/s while logging. Doing that inside LdrShutdownProcess is a
# deadlock risk, so the exit test runs with it disabled. The code also now stops
# the worker thread at process detach (noteProcessExiting), so this can go back to
# True once the exit path is confirmed clean.
vkupStallSample = False
vkupStallSampleMs = 200
vkupStallSamplesPerTick = 4
vkupStallMinMs = 1500
# --- Present synchronisation (2026-09-30, run 8) ----------------------------
# Symptom: ~50 s into the map load the game freezes; the CLIENT stops logging
# altogether (last line 19:23:12.347), the SERVER goes idle at the same moment
# (last "present rate" line, then nothing), both sit there ~40 s and Windows
# declares AppHangB1. The shadow cap patch is working (peak exactly
# 134,217,728 = 128 MB, 14517 evictions), so this is NOT memory.
#
# Candidate: bridge/src/client/d3d9_device.cpp:455 syncOnPresent() - every
# client Present WAITS on a named semaphore that only the server releases
# (bridge/src/server/main.cpp:730-735), and only *after* it completed its own
# Present. If that release is ever skipped (an early `break` out of the command
# handler, a device/swapchain reset racing the load) the calling thread - for
# the game that is the main render thread - blocks forever. Both processes idle
# + no logs + "not responding" is exactly what that looks like.
#
# Supporting evidence: NVIDIA ships an app profile for Source engines
# (bridge/src/util/config/config.cpp:135-139, regex "\\hl2\.exe$") whose only
# entry is "presentSemaphoreMaxFrames = 1" - i.e. this sync mechanism is known
# to misbehave with Source. L4D2 runs as left4dead2.exe, so it does NOT match
# that profile and runs with the default of 3 (and NV's key even has a trailing
# space, so the profile is likely dead code anyway).
#
# Test: disable the sync entirely (upstream supported key). Client and server
# then never wait on each other at Present. If the freeze disappears, this is
# the culprit; the proper fix (keep the sync but guarantee the release) can
# follow afterwards.
presentSemaphoreEnabled = False

