# --- Make the bridge's waits finite (2026-10-02, run 12) --------------------
# Why the game froze mid-session instead of stuttering: the bridge ships with
# disableTimeouts = true (global_options.h:400), i.e. EVERY wait is infinite, and
# message_channels.h:48 additionally calls setInfiniteRetries(true) as soon as the
# game window loses keyboard focus (WM_KILLFOCUS). One late/lost reply therefore
# parks the game's render thread forever - measured: run 12 froze after ~137 s with
# tid "RENDER THREAD" parked in MsgWaitForMultipleObjectsEx, the server still
# alive, no OOM, and the watchdog written to left4dead2_bridge_hang_36824.dmp.
# With timeouts enabled a stall becomes a logged, retried hiccup instead of a
# hang - and the retry warnings name whatever is actually stalling.
disableTimeouts = False
# Defaults kept otherwise: commandTimeout=1000 ms, commandRetries=300.


# --- Read-only queries must be answered (2026-10-02, run 11) ----------------
# Symptom chain that led here: the game now enters the map and runs, but the
# whole 3D image is washed cyan while the HUD is correct and the main menu is
# correct. User bisection with the console: "mat_postprocess_enable 0" fixes it
# instantly, while mat_colorcorrection / mat_dynamic_tonemapping / mat_hdr_level
# do nothing -> the fault is inside Source's 3D post-process chain (bloom /
# tonemap / gamma-via-postprocess).
#
# Root cause candidate: with sendReadOnlyCalls = False (the default) the client
# answers every read-only query with S_OK but never fills the caller's struct -
# see e.g. bridge/src/client/d3d9_surface.cpp:141 (GetDesc), and the same pattern
# in d3d9_texture.cpp, d3d9_cubetexture.cpp, d3d9_volumetexture.cpp,
# d3d9_vertexbuffer.cpp, d3d9_indexbuffer.cpp, d3d9_device.cpp (9+ places).
# The engine therefore reads UNINITIALISED memory (stack garbage) whenever it
# asks for a surface/texture description - and the post-process chain is exactly
# where it does that (it builds its render targets from those descriptions).
# Garbage formats/sizes there produce a broken bloom/tonemap composite, i.e. a
# full-screen additive tint like the cyan veil reported.
#
# Cost: read-only calls now round-trip to the server (small sync overhead).
# If this introduces stalls, set it back to False - it is one line.
# Reverted to False (2026-10-02): it did not cure the cyan post-process tint, and
# because every read-only query then round-trips to the server it multiplies the
# number of synchronous exchanges - with the bridge's default "no timeouts" that
# means far more chances to freeze forever when one reply is late (run 12 hung
# after ~137 s with the render thread parked in a window/present wait).
sendReadOnlyCalls = False

# --- Client side thread safety (2026-09-30, run 9) --------------------------
# L4D2 runs with -threads 24 and Source loads materials on a worker thread, so
# the bridge client is entered from more than one thread. The client normally
# follows the game's request: the game asks for a NON thread-safe device, so the
# client is instantiated as Direct3DDevice9Ex_LSS<false>, whose LockType is
# bridge_util::nop_sync - i.e. BRIDGE_DEVICE_LOCKGUARD() / SCOPED_LOCK compile to
# NOTHING (util_scopedlock.h:106-116, d3d9_device.h:37). The client's resource
# maps, its state shadowing and the "current command in progress" flag are then
# touched by several threads without a device lock. Upstream warns about exactly
# this in d3d9_module.cpp:645-648:
#   "A thread-safe D3D9 device has been requested while the bridge was not built
#    with thread-safety support enabled. The client should run fine if used on a
#    single thread, but may otherwise likely crash as a result."
# Our build DOES have the syncable variant (WITH_MULTITHREADED_DEVICE is on, both
# "Creating a thread-safe/NON thread-safe D3D9 device." strings are in the dll),
# so force the lock-protected instantiation. A recursive_mutex lock/unlock pair
# measures ~22ns (d3d9_device.h:35-37).
threadSafetyPolicy = 1
