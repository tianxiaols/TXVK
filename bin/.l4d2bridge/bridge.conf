# L4D2 桥客户端配置（bin\.l4d2bridge\bridge.conf）
server.useVanillaDxvk = True

exposeRemixApi = False

client.targetProcess = left4dead2.exe

client.setExceptionHandler = True

# 强制窗口化呈现（独占全屏切换会卡死游戏）
client.forceWindowed = True

# ENB 画面不对时打开：读回后缓冲（额外 IPC 开销）
# client.enableBackbufferCapture = True

# 颜色路径日志（开启会让游戏卡顿，保持关）
client.logColorPath = False

logApiCalls = False

logServerCommands = False

# 共享堆（实测会读图卡死，L4D2 必须关）
useSharedHeap = False

# 共享堆分配失败等待秒数（useSharedHeap 关闭时不起作用）
sharedHeapFreeChunkWaitTimeout = 2

clientChannelMemSize = 96MB

# 日志级别
logLevel = Info

# 2026-10-05：值类型去重恢复 True（安全）；对象绑定类去重已拆分到下面那个键（默认 False，避免 HUD 花屏）
eliminateRedundantSetterCalls = True
# 对象绑定类去重（SetTexture/SetShader/SetStreamSource/SetRenderTarget 等）：依赖镜像与服务端严格同步，
# state-block Apply 有漏洞会导致 HUD 花屏，保持 False
eliminateRedundantObjectSetterCalls = False

# 着色器缓存
vkupShaderCache = True

vkupBufferPool = True

# [vkup 2026-10-04] 零拷贝动态缓冲 lock（只对 D3DLOCK_DISCARD 生效，安全）。
# 游戏直接写进通道数据区，Unlock 只发偏移、不 memcpy；非 DISCARD（NOOVERWRITE/普通）仍走 shadow 拷贝路径。
client.optimizedDynamicLock = True

# 每 5 秒打印一行客户端统计
vkupClientDebug = True

# 脚本(.nut)可见性日志（调试用，保持关）
vkupVScriptLog = False

# 脚本可见性附加指针跳链（调试用，更啰嗦）
vkupVScriptTrace = False

# 崩溃时写 <dump>.vscript.txt（出错模块栈上脚本名）
vkupVScriptCrashTrail = True

vkupVScriptPerfPatch = True

vkupGapLog = False

vkupGapLogMs = 900

vkupLockAudit = True

vkupShadowGuard = False

vkupShadowQuarantine = False

vkupShadowQuarantineMB = 8

# 2026-10-04 20:4x: turned ON to catch the "freeze ~63-67s after map start" that hit
# three runs in a row. While the D3D9 counter is stuck this samples every thread of
# the game and reports "module+0xoffset" per frame, which is the only thing that can
# say *where* inside the game the main thread went away (the minidump alone has no
# symbols). Cost is only paid while a stall is being diagnosed.
vkupStallSample = True

# 采样间隔（毫秒）
vkupStallSampleMs = 200

# 每次采样的线程样本数
vkupStallSamplesPerTick = 4

# 判定「卡住」的最小毫秒数
vkupStallMinMs = 1500

presentSemaphoreEnabled = False

# 不强制 LDR 后处理（开 HDR 时全屏发青）
client.forceLdrPostProcess = False

disableTimeouts = False

# 只读查询不转发到服务端（转发会成倍增加同步往返）
sendReadOnlyCalls = False

threadSafetyPolicy = 1

# ===========================================================================
# 服务端 Vulkan 环境清理（2026-10-04）
#   桥客户端拉起 64 位服务端时，会给它一个"干净"的环境块：第三方隐式层
#   （MediaSDK hook / GamePP / Steam 覆盖层 / Steam 管线缓存 / Epic 覆盖层 /
#   Rockstar）与微软 D3D Mapping Layers（Dozen，会塞进 3 个假的 D3D12 设备并往
#   服务端加载 vulkan_dzn.dll + dxil.dll）全部不加载。实测：清理后实例里只剩
#   ReShade 与显卡厂商自己的层，Dozen 设备 3 -> 0。
#   只作用于服务端；32 位游戏进程自己的环境不受影响。
# ===========================================================================

vkupServerVkSanitize = True

# 要保留的层（名字子串，逗号分隔；写 none 表示一个都不留）
# 默认保留 ReShade：它是服务端唯一有意义的层（画面后处理），其界面本来也点不了
vkupServerVkKeep = reshade

# 额外要禁用的层（层名，逗号分隔）——内建清单之外的补充
vkupServerVkDisable =

# 要跳过的 ICD（manifest 文件名 glob，逗号分隔；none = 不跳过）
vkupServerVkDriversDisable = *dzn*

# ===========================================================================
# 本地 dxgi 守卫（2026-10-04）
#   游戏目录里常有一份 DXVK 的 dxgi.dll（不用桥时留下的）。桥的 32 位进程
#   已经不做渲染，若某个外部组件（实测是 steamclient.dll / Steam 覆盖层的抓帧）
#   在过图时调用 CreateDXGIFactory*，这份本地 dxgi 会在 DLL 加载过程中初始化一整个
#   Vulkan 实例（枚举 ICD 与层），并在 dxgi 自己的 SRW 锁上死锁 —— 渲染线程就此
#   卡死，表现为"进图卡住不动"。把 32 位 Vulkan 置空挡不住它（锁在 dxgi 内部）。
#   本守卫拦截 LoadLibrary*：凡是加载"本地"的 dxgi/d3d10/d3d10core/d3d11/d3d12，
#   一律改加载系统版本（不碰 Vulkan），并在日志里记下是谁在加载它。
#   ==> 用户不需要删除或改名任何文件。
# ===========================================================================

# True = 启用守卫（默认）；False = 放行本地 dxgi
vkupDxgiGuard = True

# ===========================================================================
# Steam 好友邀请窗口（2026-10-04）
#   桥下 Steam 覆盖层画不出来（32 位没有可呈现的设备，64 位加载的不是系统
#   d3d9），而且它一碰 DXGI 就会去加载游戏目录那份 DXVK dxgi.dll（死锁源头）。
#   所以这里自己开一个 Win32 小窗口：列好友 → 邀请进我的大厅 / 加入他的游戏，
#   直接调 bin\steam_api.dll 的 flat API。
#     - 游戏里点"邀请好友"：被 hook 的 ActivateGameOverlay* 会打开本窗口
#     - 兜底热键：Ctrl+Alt+I
#     - 邀请前需已在游戏大厅里（建房或进一局），窗口底部会显示当前大厅
# ===========================================================================

vkupSteamInvite = True

# ===========================================================================
# 游戏内面板的输入通道（2026-10-04）
#   实测 10:16：面板打开了，但 Esc 没关掉面板，反而触发游戏自己的"退出大厅"。
#   原因：client.hookMessagePump 默认 False ⇒ PeekMessage/GetMessage 没钩 ⇒
#   面板的按键处理从未执行，WM_KEYDOWN 直达游戏；而 L4D2 菜单不轮询
#   DirectInput 键盘，所以那条喂入路也没有键进来（"看得见、按不动"）。
#   现在代码里已改成"面板启用（vkupSteamInvite=True）就自动钩消息泵"，这里再
#   显式写一遍，便于排障时一眼看到它确实开着。
# ===========================================================================
client.hookMessagePump = True

# [vkup 2026-10-04] TEST SWITCH: >True< brings back the server-side presenter window.
# That window is what lets ReShade capture input. False = original behaviour (no window at all).
server.substituteFocusWindow = True

# =============================================================================
# VA governor for the 32 bit game process (2026-10-04).
# Client side, sampled once per second (same source as the stall report). It acts
#   * when a threshold trips ("VA pressure" / "commit pressure"), or
#   * every vkupVaForceEveryMs regardless ("forced") - this is the default while
#     the feature is being tuned, so the per-minute trend line shows whether the
#     actions actually move regions / largestFree.
# The action set is:
#   1. prune the client's own caches + idle buffer pool (memory inside the game),
#   2. have the render thread run EvictManagedResources (MANAGED texture copies),
#   3. with vkupVaAction = 2 also HeapCompact + a gentle working set trim, but
#      only on real pressure - the forced path stays on the cheap set.
# Log lines start with "[vkup] va -". vkupVaAction = 0 is report only.
#
# Values below are the 2026-10-04 "daily play" set, picked from the first test
# run (6 min, largestFree steady at ~1484MB, regions 7900 -> 8935, commit ~1.5GB):
#   * the forced cadence is the cheap set only: it gives back the buffer pool and
#     runs the evict, but keeps every cached shader (dropping shaders costs a
#     CreatePixelShader rebuild, which is what the cache exists to avoid);
#   * thresholds sit at roughly half the observed headroom, so a normal session
#     never trips them and the actions are a safety net, not steady state.
# =============================================================================
vkupVaWatch = True
# 2026-10-04 20:3x: restored to 2 (the reduction to 1 was based on the assumption
# that our trim caused the 20:22 freeze - it did not: no "ws ->" action line exists
# in that run, and the freeze wiped *both* processes' working sets at once, which
# only an external EmptyWorkingSet can do). Action set at this level: prune caches
# + managed evict, plus HeapCompact and the working set trim on real pressure.
vkupVaAction = 2
vkupVaIntervalMs = 15000
vkupVaCooldownMs = 60000
vkupVaLogEveryMs = 120000
vkupVaMinLargestFreeMB = 700
vkupVaMaxRegions = 12000
vkupVaCommitMB = 2000
vkupVaLfh = True
vkupVaForceEveryMs = 300000

# Maintenance (worker) thread priority: 0 = leave alone, 1 = above normal (default),
# 2 = highest. It only runs the VA sampling / cache pruning / stall report.
vkupWorkerPriority = 1
