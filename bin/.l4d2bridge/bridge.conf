# ===== vphysics.dll pair-list index (2026-10-07) =====
# vphysics keeps its collision-pair registry in a plain array and scans it
# linearly; on a busy level that scan is what froze the game for ~10 s. This
# index makes the same lookup O(1). 0 = off, 1 = index (skip the scan on a
# miss too, default), 2 = index for hits only (a miss still runs the scan).
vkupVphysicsPatch = 1
# Cap for the index table (MB per manager instance). The registry itself is
# 8 bytes per entry; the index needs about 5.3 bytes per entry at 0.75 load.
vkupVphysicsTableMB = 8
# Periodic "[vkup] vp:" stats line (calls/hits/appends/registry size).
vkupVphysicsLog = True

# ===== server.dll pair-list index (2026-10-07b) =====
# The game callback that vphysics drives per object pair scans its own array of
# (entity-handle, entity-handle, times) records; ~200,000 entries made it spin
# for ~10 s. 0 = off, 1 = index (default), 2 = hits only (a miss still scans),
# 3 = verify only (behaviour unchanged; reports whether the index agrees).
vkupServerPairPatch = 1
# Cap for the index table (MB). ~5.3 bytes per entry at 0.75 load.
vkupServerPairTableMB = 8
# One full-scan verification per N misses (0 = off). The verdict that matters is
# "not in the list", so this re-runs the original scan for a sample and
# complains if it disagrees.
vkupServerPairVerifyEvery = 512
# Periodic "[vkup] sp:" stats line.
vkupServerPairLog = True

# ===== CPU round (2026-10-07c): the 09:41 WOOL capture showed 1.2M-2.1M
# forwarded commands per second, ~80% of them state setters, while the existing
# de-dup removed only 0.2% of calls. =====
# Shader constant uploads (Set*ShaderConstantF, ~40% of all calls): the client
# mirror of the constant file is exactly what the 64 bit side holds, so an
# upload that changes nothing is dropped and one that changes a sub-range sends
# only that sub-range. True/False for an A/B. Watch const_skip/trim= in
# "[vkup] client stats".
vkupConstRangeDedup = True
# Vertex stream / index buffer binding de-dup (~26% of all calls; buffer, offset
# and stride all have to match). Separate from
# eliminateRedundantObjectSetterCalls, which stays off because of the old HUD
# regression.
vkupDedupStreamsIndices = True
# Mirror the ODS diagnostics (client stats / client hot / va - audit) into
# bridge32.log so a session is diagnosable without a capture tool. Rate limited.
vkupOdsLog = True
vkupOdsLogPerSec = 4

# ===== VA / cache policy round (2026-10-07d) =====
# B3: the engine's MANAGED release only pays off while the game is not growing
# itself (09:41 run: 12 requests, 10 of them freed nothing). After N requests in
# a row that freed nothing the action sleeps for vkupAvEvictBackoffMs; a request
# that does free something clears the counter immediately.
vkupAvEvictGiveUp = 3
vkupAvEvictBackoffMs = 300000
# A2: reserve shadow-pool chunks while the address space is roomy (healthy tier
# and largestFree >= vkupAvPrewarmMinFreeMB), so a new 64MB chunk request does
# not land at the moment the game itself needs the space.
vkupAvPrewarmMB = 192
vkupAvPrewarmEveryMs = 60000
vkupAvPrewarmMinFreeMB = 1500
# B4: shader create cache / idle buffer pool are dropped by age, not by a flat
# percentage: entries used within the cold window survive, everything older goes.
vkupShaderCacheColdMs = 60000
vkupBufferPoolColdMs = 45000

