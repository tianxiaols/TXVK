; 桥 / 帧生成设置，由 64 位 DXVK 启动时读取（与本文件同目录）。

[vkup]

; 内部渲染分辨率百分比（此游戏必须 100，调低会让引擎建设备失败）
render_pct = 100

; 帧生成开关（0 = 关，2 = 每个游戏帧插一帧）
fg = 0

; 强制帧生成（1 = 无视帧率始终插帧，调试用；帧生成已整体关闭，此项保持 0）
fg_force = 0

; Present 线程多媒体调度（帧生成用，已随帧生成一并关闭）
fg_mmcss = 0

; Present 放大算法（2 = 双三次 + RCAS，画质最好）
fsr = 2

; 插值分辨率（每轴百分比，越低越省但越软）
fg_scale = 50

; GPU 异步捕获（桥下 D3D9 读回是黑帧，故 0）
fg_capture_gpu = 0

; 捕获源为交换链图像（调试亮度来源用）
fg_capture_src_swap = 0

; 模型可用的捕获间隔时间百分比
fg_budget_pct = 100

; 预算刹车进入阈值（百分比）
fg_brake_enter_pct = 100

; 预算刹车退出阈值（百分比）
fg_brake_leave_pct = 85

; 刹车状态最短持续帧数
fg_brake_min_frames = 30

; 帧新鲜度门（1 = 精确）
fg_max_age = 1

; 无新帧时重复上一真实帧（保持恒定节奏）
fg_dup_on_miss = 1

; 喂模型当前帧（1 = 正确，0 = 晚一帧读）
fg_capture_now = 1

; ncnn Vulkan 设备索引
fg_gpu = 0

; 模型目录（rife-v4.6 最快）
fg_model = rife-v4.6

; 高于此源帧率不插帧
fg_max_input_fps = 60

; 帧生成额外日志
fg_debug = 0

; 进程内虚拟地址采样（输出到 DebugView / WOOL.log）
memwatch = 1

; 采样间隔（秒）
memwatch_interval = 10

; 采样目标进程
memwatch_target = left4dead2.exe

; CPU 优化总开关
opt = 1

; 内存压力下 trim 工作集（0 = 关闭）
; 2026-10-04 20:3x：恢复为 1。20:22 那次卡死与本键无关（它的下限 512MB，而实测被清到
; 2MB；且游戏进程同时被清 ⇒ 只有外部工具会同时动两个进程）。策略不变：start=80% stop=65%。
opt_ws_trim = 1

; 堆压缩
opt_heap_compact = 1

; 低碎片堆（LFH）
opt_lfh = 1

; 进程优先级优化（0 = 不动；1 = ABOVE_NORMAL；2 = HIGH）
; 2026-10-04 20:2x：1 -> 2（用户要求"稍微调高一点点"）。作用对象是本进程（64 位服务端渲染器）。
; 注意：2 = HIGH 正是当年"有人反馈 CPU 占用太高"的那一档（那次还叠加了 TIME_CRITICAL 线程）；
; 32 位游戏本身是用 -high 拉起的，所以这一档相当于让渲染器与游戏同级。想回到温和档写回 1。
opt_priority = 2

; 计时器精度优化
opt_timer = 1

; 打印优化状态行
opt_report = 1

; 优化调试日志（0 = 关，1 = 开）
opt_debug = 0

; LOD 偏置（×1000）
opt_lod_bias_x1000 = 0

; 动态 LOD（仅在压力门越过时生效；发布默认关，避免模型/纹理变糊）
opt_lod_dynamic = 0

; LOD 每级步进（×1000）
opt_lod_step_x1000 = 50

; LOD 上限（×1000）
opt_lod_max_x1000 = 1500

; 解除映射后 trim
opt_unmap_trim = 1

; unmap trim 百分比
opt_unmap_pct = 50

; mip 裁剪级数（发布默认 0 = 不裁，避免纹理变糊）
opt_mip_levels = 0

; 状态行打印间隔（毫秒）
opt_report_ms = 10000

; 磁盘 I/O 优先级优化
opt_io_priority = 1

; 电源节流优化
opt_power_throttle = 1

; CPU 亲和掩码（0 = 不设）
opt_affinity_mask = 0

; 线程优先级（0 = 不动；1 = ABOVE_NORMAL；2 = HIGHEST；15 = TIME_CRITICAL）
; 2026-10-04 20:3x：2 -> 1（用户要求"设置回去"）。原因见代码注释：HIGH 优先级类进程里
; 相对 HIGHEST(+2) = 线程优先级 15，会盖过 32 位游戏自身的线程(13)，呈现线程一旦空转
; 就能把游戏饿死 ⇒ 表现为"突然卡住"。1 = ABOVE_NORMAL(+1) = 与原来的默认档一致。
opt_thread_priority = 1

; 优先级提升
opt_priority_boost = 0

; 压力门阈值：系统内存负载 ≥ 此值才启用 trim/LOD 等优化
opt_ws_start_pct = 80

; ===== GPU / 显存侧（2026-10-04）=============================================
; 之前所有内存旋钮都看"系统内存负载"，与"显存被吃满"无关。下面这组看的是
; DXVK 报的显存堆用量/预算（VK_EXT_memory_budget），每约 120 帧采样一次。
; 触发后：① 动态 LOD / mip 裁剪按显存压力生效 ② 向引擎少报可用显存

; 显存门控总开关（0 = 完全不看显存）
opt_vram_gate = 1

; 显存占用达到预算的这个百分比时开门
opt_vram_start_pct = 85

; 降到这个百分比以下再关门（迟滞，避免抖动）
opt_vram_stop_pct = 75

; 开门期间向引擎上报"可用显存"的百分比（Source 会据此收缩自己的纹理缓存）
opt_vram_relief_pct = 55

; 开门期间回收"空闲纹理的重复副本"（64 位是 host-visible 镜像缓冲，32 位是池副本）
; 图像仍是唯一权威副本，回收后：再上传走惰性路径、LockRect 走图像读回，所以不掉内容
; （D3D9 的 IDirect3DDevice9::EvictManagedResources() 现在也是真实现，用它可随时手动触发）
opt_vram_reclaim = 1
