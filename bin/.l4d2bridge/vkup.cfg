; 桥 / 帧生成设置，由 64 位 DXVK 启动时读取（与本文件同目录）。

[vkup]

; 内部渲染分辨率百分比（此游戏必须 100，调低会让引擎建设备失败）
render_pct = 100

; 帧生成开关（0 = 关，2 = 每个游戏帧插一帧）
fg = 0

; 强制帧生成（1 = 无视帧率始终插帧，调试用；帧生成已整体关闭，此项保持 0）
fg_force = 0

; Present 线程多媒体调度（帧生成用，已随帧生成一并关闭）
fg_mmcss = 0

; Present 放大算法（2 = 双三次 + RCAS，画质最好）
fsr = 2

; 插值分辨率（每轴百分比，越低越省但越软）
fg_scale = 50

; GPU 异步捕获（桥下 D3D9 读回是黑帧，故 0）
fg_capture_gpu = 0

; 捕获源为交换链图像（调试亮度来源用）
fg_capture_src_swap = 0

; 模型可用的捕获间隔时间百分比
fg_budget_pct = 100

; 预算刹车进入阈值（百分比）
fg_brake_enter_pct = 100

; 预算刹车退出阈值（百分比）
fg_brake_leave_pct = 85

; 刹车状态最短持续帧数
fg_brake_min_frames = 30

; 帧新鲜度门（1 = 精确）
fg_max_age = 1

; 无新帧时重复上一真实帧（保持恒定节奏）
fg_dup_on_miss = 1

; 喂模型当前帧（1 = 正确，0 = 晚一帧读）
fg_capture_now = 1

; ncnn Vulkan 设备索引
fg_gpu = 0

; 模型目录（rife-v4.6 最快）
fg_model = rife-v4.6

; 高于此源帧率不插帧
fg_max_input_fps = 60

; 帧生成额外日志
fg_debug = 0

; 进程内虚拟地址采样（输出到 DebugView / WOOL.log）
memwatch = 1

; 采样间隔（秒）
memwatch_interval = 10

; 采样目标进程
memwatch_target = left4dead2.exe

; CPU 优化总开关
opt = 1

; 内存压力下 trim 工作集
opt_ws_trim = 1

; 堆压缩
opt_heap_compact = 1

; 低碎片堆（LFH）
opt_lfh = 1

; 进程优先级优化
opt_priority = 1

; 计时器精度优化
opt_timer = 1

; 打印优化状态行
opt_report = 1

; 优化调试日志（0 = 关，1 = 开）
opt_debug = 0

; LOD 偏置（×1000）
opt_lod_bias_x1000 = 0

; 动态 LOD（仅在压力门越过时生效；发布默认关，避免模型/纹理变糊）
opt_lod_dynamic = 0

; LOD 每级步进（×1000）
opt_lod_step_x1000 = 50

; LOD 上限（×1000）
opt_lod_max_x1000 = 1500

; 解除映射后 trim
opt_unmap_trim = 1

; unmap trim 百分比
opt_unmap_pct = 50

; mip 裁剪级数（发布默认 0 = 不裁，避免纹理变糊）
opt_mip_levels = 0

; 状态行打印间隔（毫秒）
opt_report_ms = 10000

; 磁盘 I/O 优先级优化
opt_io_priority = 1

; 电源节流优化
opt_power_throttle = 1

; CPU 亲和掩码（0 = 不设）
opt_affinity_mask = 0

; 线程优先级
opt_thread_priority = 2

; 优先级提升
opt_priority_boost = 1

; 压力门阈值：系统内存负载 ≥ 此值才启用 trim/LOD 等优化
opt_ws_start_pct = 80
