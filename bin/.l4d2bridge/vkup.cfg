; [bridge] frame generation OFF and this file is read by the 64-bit DXVK in
; "bin\.trex\" (DXVK looks next to its own DLL).
; ---------------------------------------------------------------------------
;  vkup settings - read by dxvk_d3d9_last.dll at startup.
;  No launcher script, no environment variables, no registry keys involved.
;  This file must sit next to dxvk_d3d9_last.dll (the game's bin folder).
;  Changes take effect on the next game start.
; ---------------------------------------------------------------------------

[vkup]

; --- internal render resolution -------------------------------------------
; 100 = native (no scaling). KEEP AT 100 on this game: shrinking the D3D9 back
; buffer makes the engine fail to create its D3D device ("Failed to create D3D
; device!"), because it validates the back buffer size itself.
; Lower values only work if that check is bypassed some other way.
render_pct = 100
; --- frame generation (RIFE neural interpolation) -------------------------
; 0 = off, 2 = generate one in-between frame per game frame.
; Requires: vsync OFF in the game's video options (presenting twice per frame
; cannot work in FIFO mode - the log will say it is idle otherwise).
; Needs rife_bridge.dll + ncnn.dll + rife-models\rife-v4.6 next to this file.
fg = 0
; --- force frame generation, bypassing the adaptive enable/disable logic ----
; 1 = always generate while fg = 2 (debugging the feature),
; 0 = adaptive (default): only runs while the game itself is slow enough for
;     an in-between frame to fit into the frame interval.
; 0 = adaptive (chosen): frame generation runs only while the game itself is
;     SLOWER than fg_max_input_fps (60). That is the whole point of an in-between
;     frame - above 60 fps the game is already smooth and the capture
;     (measured 6.7-7.3 ms per frame) costs more than the extra frame is worth.
;     The gate keeps a +-3 fps hysteresis band around the threshold (on below
;     57, off above 63) so it cannot flap, the measurement being a 3 second
;     window - see the "present rate" line in left4dead2_d3d9.log.
; 1 = always generate, regardless of the game's frame rate (A/B testing only;
;     with the frame rate capped by d3d9.maxFrameRate this is the combination
;     that produced "122 presents/s, extra presents = 2.00 per game frame").
fg_force = 1

; --- MMCSS for the presenting thread ---------------------------------------
; 1 = register the thread that calls Present with the multimedia scheduler
;     ("Games" task): a guaranteed CPU share, i.e. less scheduler jitter between
;     the two presents that frame generation issues per game frame.
; 0 = leave scheduling completely alone.
fg_mmcss = 1

; --- present blit spatial upscaling ----------------------------------------
; 0 = plain bilinear (original behaviour)
; 1 = bilinear + RCAS sharpening
; 2 = bicubic (Catmull-Rom) upscale + RCAS sharpening   [best quality]
; Only takes effect when the present blit actually scales up, i.e. when
; render_pct < 100 or when a generated frame is presented at its lower
; interpolation resolution.
fsr = 2
; Interpolation resolution, percent of the presented size per axis.
;  50 -> 1280x720 for a 2560x1440 display: ~24 ms per generated frame,
;        which allows doubling a source of roughly 20 fps and above.
;  35 -> 896x504: ~12 ms per frame, doubles sources up to roughly 40 fps.
; The generated frame is scaled up by the present blit, so it is slightly
; softer than a real frame - the lower the value the softer.
fg_scale = 50
# [vkup 2026-10-03] 1 = capture on the GPU: downscale the frame the swap chain
# already copies (the one the display shows) and read it back asynchronously,
# waiting only for a fence that was signalled 4 frames ago. 0 = fall back to the
# D3D9 StretchRect + GetRenderTargetData path, which returns black frames under
# the bridge (the black input guard then drops them, so framegen shows nothing).
fg_capture_gpu = 0
# [vkup 2026-10-03] 1 = blit the capture straight from the swap chain image.
# 0 = blit from the full resolution copy this swap chain makes for the real
# frames (both should hold the same picture; this is how we find out which one
# carries the brightness).
fg_capture_src_swap = 0

; Share of the time until the next capture that the model may use (percent).
; The deadline is one capture interval; 70 was too strict at 35% scale (at 61 fps
; it demanded <= 11.4 ms while the model needs 12-13 ms), so 85 is the default
; and still leaves ~2.5 ms of slack at 60 fps. Lower it if the generated frames
; arrive late (reads as judder), raise it if generation is skipped too often.
fg_budget_pct = 100
# [vkup 2026-10-03] Frame generation brake (latching). Enter the skip state at
# enter% of the budget, leave it at leave% (the gap is the hysteresis) and only
# after min_frames frames in the state. Raise enter / lower leave to make the
# decision even calmer, lower min_frames to let it react sooner.
fg_brake_enter_pct = 100
fg_brake_leave_pct = 85
fg_brake_min_frames = 30
# [vkup 2026-10-03] Freshness gate. A generated frame is only shown when it
# belongs exactly between the two real frames the display is holding; the ideal
# age is 1 game frame, and anything older describes a moment already passed,
# which shows up as flicker. 1 = exact, 2 = one frame of tolerance, 4 = loose.
fg_max_age = 1
# Repeat the held real frame when a slot has no fresh result, keeping two
# presents per game frame (constant cadence). 0 = old behaviour (1 present).
fg_dup_on_miss = 1
# [vkup 2026-10-03] 1 = feed the model the frame that is current (the display
# pipeline then delivers results at exactly the right slot); 0 = the old
# one-frame-late read, which makes every result arrive too old to show.
fg_capture_now = 1

; ncnn vulkan device index (0 = the NVIDIA GPU on this machine).
fg_gpu = 0

; Model folder under <bin>\rife-models. rife-v4.6 measured ~1.5-4x faster
; than rife-v2.3 / rife-anime on this GPU, so v4.6 is the one to use.
fg_model = rife-v4.6

; Above this source frame rate the generated frames are not worth the GPU time.
fg_max_input_fps = 60

; 1 = extra log lines about frame generation.
fg_debug = 0


; [bridge] in-process VA sampler -> OutputDebugStringA (DebugView / WOOL.log)
memwatch = 1
memwatch_interval = 10
memwatch_target = left4dead2.exe
opt = 1
# [vkup 2026-10-03] The four pressure-gated features stay ENABLED and adapt to
# memory pressure: they do nothing while system memory load is below
# opt_ws_start_pct (80), and engage on their own when it climbs past it - that
# is the intended behaviour, not a switch to force. Verified firing on
# 2026-10-03 with opt_ws_start_pct=30 (37 trim steps, "mip clipping on, cap 10
# levels", "texture budget 50%", lod 0.85); with the gate at 80 they simply sit
# idle in normal play (status line: "trim idle | budget 100% | lod 0.0 |
# mipclip 0"). Set to 0 only if you never want that feature even under pressure.
opt_ws_trim = 1
opt_heap_compact = 1
opt_lfh = 1
opt_priority = 1
opt_timer = 1
opt_report = 1
opt_debug = 0
opt_lod_bias_x1000 = 0
# [vkup 2026-10-03] Same policy as opt_ws_trim: enabled, but only active while
# the pressure gate (opt_ws_start_pct) is crossed. The bias / budget / mip cap
# below are the amounts used when it does engage.
opt_lod_dynamic = 1
opt_lod_step_x1000 = 50
opt_lod_max_x1000 = 1500
opt_unmap_trim = 1
opt_unmap_pct = 50
opt_mip_levels = 10
opt_report_ms = 10000
# [vkup 2026-10-03] The rest of restore818 ApplyCpuOptimizations():
opt_io_priority = 1
opt_power_throttle = 1
# [vkup 2026-10-03] 0 = leave the affinity alone. The 15:2x test run used
# 16777215 (all logical CPUs) to prove the path works; back to 0 now, so the
# server keeps whatever the OS assigned.
opt_affinity_mask = 0
opt_thread_priority = 2
opt_priority_boost = 1
# [vkup 2026-10-03] Pressure gate for ws_trim / lod_dynamic / unmap_trim /
# mip_clip. The signal is GLOBALMEMORYSTATUSEX.dwMemoryLoad, i.e. the whole
# machine's physical memory usage (not this process):
#   load >= opt_ws_start_pct  -> the four features engage;
#   load <= opt_ws_stop_pct   -> they back off (hysteresis).
# Set to 60 on request (was 80; 30 was used once to force them for a test).
# opt_ws_stop_pct is not set here, so the code clamps it to start-5 = 55.
# Status line prints every opt_report_ms so the gate can be watched live:
#   ... | system load NN% | trim active/idle | budget NN% | lod X | mipclip N
opt_ws_start_pct = 60
